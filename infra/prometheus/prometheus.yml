global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aicte-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['host.docker.internal:4000']

  - job_name: 'aicte-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:4001']

  - job_name: 'aicte-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
