[project]
name = "aicte-ai"
version = "1.0.0"
description = "AICTE Approval Control Tower AI Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "sentence-transformers>=2.5.1",
    "scikit-learn>=1.4.1",
    "xgboost>=2.0.3",
    "lifelines>=0.28.0",
    "dateparser>=1.2.0",
    "pypdf>=4.2.0",
    "Pillow>=10.3.0",
    "psycopg[binary]>=3.1.18"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
